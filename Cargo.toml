[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/niklas-heer/takewise"

[workspace.dependencies]
takewise-core = { path = "crates/takewise-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3.27.0"
takewise-media = { path = "crates/takewise-media" }
# The macOS bridges; one version for takewise-media and the window, matching
# the objc2 crates gpui-kit uses (CVPixelBuffer must be the same type).
objc2 = "0.6.5"
# The About panel (NSApplication), with the features gpui-kit's GPUI already
# builds AppKit with, plus those of the panel's credits.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSAttributedString", "NSFont", "NSParagraphStyle", "NSText", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVTime", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime", "CMSync", "CMBase"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSDate", "NSRunLoop", "NSObject", "NSAttributedString", "NSRange", "NSArray", "NSError"] }

[workspace.lints.rust]
# Denied everywhere but takewise-media, the macOS bridge crate
# (see the decision "Build Takewise in Rust with GPUI").
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
todo = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
redundant_closure_for_method_calls = "allow"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
