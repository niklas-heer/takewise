[package]
name = "takewise-core"
version = "0.0.0"
description = "Takewise's UI-free model: the project folder format, ledger, script edits, checks, ranking and export."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hound = "3.5.1"
jiff = { version = "1.0.2", default-features = false, features = ["std", "serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tempfile.workspace = true
thiserror = "2.0.21"
toml_edit = { version = "0.25.20", default-features = false, features = ["parse", "display"] }
toml = { version = "1.2.2", default-features = false, features = ["std", "serde", "parse", "display"] }

uuid = { version = "1.29.3", features = ["v4"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[features]
# Lets tests make commits fail midway (takes::fail_commits_after_renames).
test-faults = []

[lints]
workspace = true
