[package]
name = "takewise"
version = "0.1.0"
description = "Record voiceover narration over a finished film, line by line, with checks and an agent-friendly CLI."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
jiff = { version = "1.0.2", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
takewise-core.workspace = true
takewise-media.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile.workspace = true

[lints]
workspace = true
