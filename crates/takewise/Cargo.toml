[package]
name = "takewise"
version = "0.2.0"
description = "Record voiceover narration over a finished film, line by line, with checks and an agent-friendly CLI."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
# Pinned exactly: gpui-kit pins its GPUI snapshot (gpui-pre 0.3.12).
gpui-kit = { version = "=0.10.0", default-features = false }
jiff = { version = "1.0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
notify = "8.2.0"
serde.workspace = true
serde_json.workspace = true
takewise-core.workspace = true
takewise-media.workspace = true
tempfile.workspace = true
# Only for the `screenshots` feature: cropping and writing the README's
# screenshots as PNGs.
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
png = { version = "0.18.1", optional = true }

[features]
# `takewise screenshots`: renders the README's screenshots offscreen
# (scripts/screenshots, `mise run screenshots`). Never part of a release.
screenshots = ["dep:image", "dep:png", "gpui-kit/test-support"]

[dev-dependencies]
takewise-core = { workspace = true, features = ["test-faults"] }
gpui-kit = { version = "=0.10.0", default-features = false, features = ["test-support"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints]
workspace = true
